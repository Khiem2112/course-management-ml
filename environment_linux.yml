name: course_management
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core ---
  - python=3.12
  - pip

  # --- Database ---
  - mysqlclient

  # --- Data Science & ML ---
  # All these are best managed by conda
  - numpy
  - scipy
  - scikit-learn
  - catboost
  - lightgbm
  - xgboost
  - mkl            

  # --- Plotting & Utils ---
  - plotly
  - seaborn        
  - graphviz       
  - colorlog
  - fonttools
  - narwhals
  - pytz
  - tzdata
  - pyparsing
  - joblib
  - kiwisolver
  - cycler
  - threadpoolctl

  # --- Pip-Only Packages ---
  - pip:
    # Your Original Goal (Qt Tools)
    - PyQt6             # The main PyQt6 library
    - PyQt6-WebEngine   # The web engine you need
    # This was the user's original package, which is a dependency for PyQt6-WebEngine
    - PyQt6-WebEngine-Qt6 
    - qt-tools          # <-- This provides pyuic6 and avoids the conflict

    # Other pip-only packages
    - scienceplots==2.1.1