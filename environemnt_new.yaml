name: course_env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12.12
  - pip

  # Conda packages
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - lightgbm
  - catboost
  - plotly
  - tqdm
  - psutil

  - graphviz
  - python-graphviz

  - mysqlclient
  - pip

  - pip:
      - PyQt6
      - PyQt6-WebEngine
      - python-dotenv
      - mysql-connector-python
      - umap-learn
      - numba
      - llvmlite
      - colorlog
      - scienceplots
      - narwhals
      - pynndescent
